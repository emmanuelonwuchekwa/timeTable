<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My day planner</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d5dce3;--rigid:#1f3a5f;--flex:#1f8a7d;--flexbg:#e6f4f2;--warn:#b3341f;--warnbg:#fbeae7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--panel:#18222c;--ink:#e6edf3;--mute:#93a1ae;--line:#2b3946;--rigid:#7fa6d9;--flex:#4fc4b3;--flexbg:#12302d;--warn:#ff8a75;--warnbg:#3a1d18}}
:root[data-theme="dark"]{--bg:#0f161d;--panel:#18222c;--ink:#e6edf3;--mute:#93a1ae;--line:#2b3946;--rigid:#7fa6d9;--flex:#4fc4b3;--flexbg:#12302d;--warn:#ff8a75;--warnbg:#3a1d18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;min-height:100%}
main{max-width:560px;margin:0 auto;padding:0 14px 110px}
header{padding:14px 0 8px}
h1{font-size:26px;margin:0;font-weight:700;line-height:1.1}
.sub{color:var(--mute);margin:2px 0 0;font-size:14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 0;background:var(--bg)}
.tabs button{min-height:48px;padding:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font:600 14px Barlow,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button i{font-style:normal;font-weight:500;font-size:11px;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--rigid);border-color:var(--rigid);color:var(--bg)}
.tabs button[aria-selected="true"] i{color:var(--bg);opacity:.85}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flex);outline-offset:2px}
.sum{color:var(--mute);font-size:14px;margin:6px 0 10px}
.sum b{color:var(--ink)}
.card{background:var(--panel);border-radius:12px;padding:12px 14px;border:1px solid var(--line);margin-bottom:8px}
.card.rigid{border-left:6px solid var(--rigid)}
.card.flex{border:1.5px dashed var(--flex);background:var(--flexbg)}
.card.clash{border-color:var(--warn);background:var(--warnbg)}
.when{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.when span{color:var(--mute);font-weight:500;font-size:13px}
.name{font-weight:600;font-size:18px;margin-top:2px;overflow-wrap:anywhere}
.tag{font-size:14px;color:var(--mute);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:2px}
.tag .k{font-weight:600;color:var(--rigid)}
.flex .tag .k{color:var(--flex)}
.warn{color:var(--warn);font-size:14px;font-weight:600;margin-top:6px}
.tools{display:flex;gap:6px;margin-top:10px}
.tools button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font:500 14px Barlow,system-ui,sans-serif;cursor:pointer}
.tools button.del{color:var(--warn)}
.gap{margin:0 0 8px 10px;padding:2px 10px;color:var(--mute);font-size:13px;border-left:2px dotted var(--line)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--mute)}
.foot{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:14px}
.foot select{width:auto;min-height:44px}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 16px Barlow,system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);min-height:44px;font-size:14px;padding:0 14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;min-height:56px;padding:0 22px;border-radius:28px;background:var(--rigid);color:var(--bg);border:0;font:700 17px Barlow,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(10,18,26,.55);z-index:7}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#sheet h2{font-size:20px;margin:0 0 12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:4px;font-weight:500}
.full{grid-column:1/-1}
input,select{font:16px Barlow,system-ui,sans-serif;min-height:48px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;flex-direction:row;align-items:center;justify-content:center;min-height:48px;color:var(--ink);cursor:pointer;font-size:16px}
.seg input{position:absolute;opacity:0;width:1px;min-height:0}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--flex);outline-offset:-2px}
.hint{font-size:13px;color:var(--mute);margin:4px 0 0}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.err{color:var(--warn);font-size:14px;min-height:18px}
</style>
</head>
<body>
<main>
<header><h1 id="dn">My day planner</h1><p class="sub">Rigid = fixed time. Flexible = can slide.</p></header>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="sum" id="sum"></div>
<div id="list"></div>
<div class="foot">Copy to <select id="cto" aria-label="Copy to day"></select><button class="btn ghost" id="cbtn" type="button">Copy</button><button class="btn ghost" id="clr" type="button">Clear day</button></div>
</main>
<button class="fab" id="add" type="button">+ Add block</button>
<div id="ov" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh" hidden>
<h2 id="sh">Add block</h2>
<form id="f" autocomplete="off">
  <label class="full">What are you doing<input id="t" placeholder="e.g. Set up new laptops" required></label>
  <label>Start<input id="s" type="time" value="09:00" required></label>
  <label>End<input id="e" type="time" value="10:00" required></label>
  <label class="full">Where<input id="l" list="locs" placeholder="e.g. Head office, IT room"></label>
  <datalist id="locs"></datalist>
  <div class="full"><span style="font-size:14px;color:var(--mute);font-weight:500">Type</span>
    <div class="seg" style="margin-top:4px"><label><input type="radio" name="r" value="1" checked>Rigid</label><label><input type="radio" name="r" value="0">Flexible</label></div>
    <p class="hint">Rigid stays put. Flexible can be nudged around rigid blocks.</p></div>
  <div class="err full" id="err" role="alert"></div>
  <div class="acts full"><button class="btn ghost" id="cancel" type="button" style="min-height:48px;font-size:16px">Cancel</button><button class="btn" id="save" type="submit">Add to day</button></div>
</form>
</section>
<script>
const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let st={},day=D[(new Date().getDay()+6)%7],editId=null;
try{st=JSON.parse(localStorage.getItem('tt-v1')||'{}')}catch(x){st={}}
D.forEach(d=>{if(!Array.isArray(st[d]))st[d]=[]});
const $=id=>document.getElementById(id);
const persist=()=>{try{localStorage.setItem('tt-v1',JSON.stringify(st))}catch(x){}};
const tm=v=>{const[a,b]=v.split(':').map(Number);return a*60+b};
const fm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=m=>{const h=Math.floor(m/60),r=m%60;return((h?h+'h ':'')+(r?r+'m':''))||'0m'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid=()=>Date.now()+''+Math.random().toString(36).slice(2,6);
function openSheet(b){
  editId=b?b.id:null;$('f').reset();$('err').textContent='';
  $('sh').textContent=b?'Edit block':'Add block';$('save').textContent=b?'Save changes':'Add to day';
  if(b){$('t').value=b.t;$('s').value=fm(b.s);$('e').value=fm(b.e);$('l').value=b.l;document.querySelector('input[name=r][value="'+(b.r?1:0)+'"]').checked=true}
  $('ov').hidden=false;$('sheet').hidden=false;$('add').hidden=true;$('t').focus();
}
function closeSheet(){editId=null;$('ov').hidden=true;$('sheet').hidden=true;$('add').hidden=false}
function render(){
  $('dn').textContent=FULL[D.indexOf(day)];
  $('tabs').innerHTML=D.map(d=>`<button role="tab" aria-selected="${d===day}" data-d="${d}">${d}<i>${st[d].length||'·'}</i></button>`).join('');
  $('cto').innerHTML=D.filter(d=>d!==day).map(d=>`<option>${d}</option>`).join('');
  const items=st[day].slice().sort((a,b)=>a.s-b.s||a.e-b.e);
  const all=new Set();D.forEach(d=>st[d].forEach(b=>b.l&&all.add(b.l)));
  $('locs').innerHTML=[...all].map(l=>`<option value="${esc(l)}">`).join('');
  const locs=[...new Set(items.map(b=>b.l).filter(Boolean))],rg=items.filter(b=>b.r).length;
  $('sum').innerHTML=items.length?`<b>${rg}</b> rigid · <b>${items.length-rg}</b> flexible${locs.length?' · '+esc(locs.join(', ')):''}`:'';
  if(!items.length){$('list').innerHTML='<div class="empty">Nothing planned for '+FULL[D.indexOf(day)]+' yet.<br>Tap <b>+ Add block</b> to start.</div>';return}
  let h='',reach=null;
  items.forEach(b=>{
    if(reach!==null&&b.s-reach>=15)h+=`<div class="gap">Free ${fm(reach)}–${fm(b.s)} (${dur(b.s-reach)})</div>`;
    const cl=items.filter(o=>o!==b&&o.s<b.e&&b.s<o.e);
    h+=`<div class="card ${b.r?'rigid':'flex'} ${cl.length?'clash':''}">
    <div class="when">${fm(b.s)} – ${fm(b.e)}<span>${dur(b.e-b.s)}</span></div>
    <div class="name">${esc(b.t)}</div>
    <div class="tag"><span class="k">${b.r?'Rigid':'Flexible'}</span>${b.l?'<span>at '+esc(b.l)+'</span>':''}</div>
    ${cl.length?`<div class="warn">Clashes with ${esc(cl.map(o=>o.t).join(', '))}</div>`:''}
    <div class="tools">${b.r?'':`<button data-a="n" data-v="-15" data-i="${b.id}" aria-label="Move 15 minutes earlier">−15m</button><button data-a="n" data-v="15" data-i="${b.id}" aria-label="Move 15 minutes later">+15m</button>`}
    <button data-a="ed" data-i="${b.id}">Edit</button><button class="del" data-a="del" data-i="${b.id}">Delete</button></div></div>`;
    reach=reach===null?b.e:Math.max(reach,b.e);
  });
  $('list').innerHTML=h;
}
$('tabs').onclick=e=>{const b=e.target.closest('[data-d]');if(b){day=b.dataset.d;render()}};
$('add').onclick=()=>openSheet();
$('cancel').onclick=closeSheet;$('ov').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
$('f').onsubmit=e=>{
  e.preventDefault();
  const s=tm($('s').value),en=tm($('e').value);
  if(en<=s){$('err').textContent='End time must be after start time.';return}
  const b={id:editId||nid(),t:$('t').value.trim(),s,e:en,l:$('l').value.trim(),r:document.querySelector('input[name=r]:checked').value==='1'};
  if(editId)st[day]=st[day].map(x=>x.id===editId?b:x);else st[day].push(b);
  persist();closeSheet();render();
};
$('list').onclick=e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.i,b=st[day].find(x=>x.id===id);if(!b)return;
  if(a==='ed'){openSheet(b);return}
  if(a==='del')st[day]=st[day].filter(x=>x.id!==id);
  if(a==='n'){const v=+t.dataset.v;if(b.s+v>=0&&b.e+v<=1440){b.s+=v;b.e+=v}}
  persist();render();
};
$('cbtn').onclick=()=>{const to=$('cto').value;if(!to)return;st[to]=st[to].concat(st[day].map(b=>({...b,id:nid()})));persist();day=to;render()};
$('clr').onclick=()=>{if(st[day].length&&confirm('Clear all blocks on '+FULL[D.indexOf(day)]+'?')){st[day]=[];persist();render()}};
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{if(!$('sheet').hidden)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){const i=D.indexOf(day)+(dx<0?1:-1);if(i>=0&&i<7){day=D[i];render()}}},{passive:true});
render();
</script>
</body>
</html>
